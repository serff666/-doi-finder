name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: ruff check --select E9,F63,F7,F82 .
      - run: pytest -q
      - run: python tests/e2e_journal.py
      - run: python tests/web_retry_check.py
      - run: python tests/web_i18n_check.py
      - run: python tests/web_history_check.py
      - run: python tests/i18n_audit.py
